name: Release

# Fully autonomous changesets release.
#
# On every push to `main`:
#   1. If there are pending `.changeset/*.md` files, bump every affected
#      package version + regenerate changelogs (`changeset version`),
#      commit the result back to `main` as
#      `chore(release): version packages [skip ci]` (the skip-ci marker
#      stops that commit from re-triggering this workflow), then publish
#      every public package to npm.
#   2. If there are none, there is nothing to release and the job no-ops.
#
# This removes the old two-step dance (merge feature PR → a bot opens a
# "version packages" PR → a human merges THAT PR → publish). Authors still
# add a changeset at push time (CLAUDE.md Rule #12); everything after the
# merge to `main` is automatic.
#
# ── Publish auth (the E403 fix) ───────────────────────────────────────────
# Publishing fails with `E403 … Two-factor authentication or granular access
# token with bypass 2fa enabled is required` when `NPM_TOKEN` cannot satisfy
# the npm account's 2FA-for-publish policy. Use ONE of:
#   • a classic **Automation** token (npmjs.com → Access Tokens → Generate
#     New Token → Classic → "Automation") — automation tokens bypass 2FA in
#     CI and are the simplest fix; or
#   • a **Granular Access Token** scoped to @template-goblin with
#     "Read and write" packages permission.
# Store it as the `NPM_TOKEN` repository secret (Settings → Secrets and
# variables → Actions). A login/password token, or a token that prompts for
# an OTP at publish time, will keep failing with E403.
#
# If branch protection blocks the github-actions bot from pushing the
# version commit to `main`, allow it to bypass in Settings → Branches.
#
# `publish-sdk.yml` remains as a manual (workflow_dispatch) escape hatch.

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: 22

jobs:
  release:
    name: Version and publish via changesets
    runs-on: ubuntu-latest
    if: github.repository == 'JaiminPatel345/template-goblin'

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so changeset can read commit context, and so the
          # version-bump commit can be pushed back to main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify NPM_TOKEN is set
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect pending changesets
        id: detect
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv 'README\.md'; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Pending changesets found — will version + publish."
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets — nothing to release."
          fi
          # Capture the SDK version BEFORE the bump so we can detect a major
          # crossing afterwards (Rule #14 tag + release).
          echo "core_before=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Apply version bump + changelogs
        if: steps.detect.outputs.has_changesets == 'true'
        run: pnpm changeset version

      - name: Build all packages
        # Builds in dependency order (types → core → ui) and copies each
        # package README into its dist/ for the published tarball.
        if: steps.detect.outputs.has_changesets == 'true'
        run: pnpm build

      - name: Commit + push version bump
        # Pushed BEFORE publish so a push failure (e.g. branch protection)
        # aborts the run before anything reaches npm — keeping the repo and
        # the registry in lockstep. `[skip ci]` stops the re-trigger loop.
        if: steps.detect.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): version packages [skip ci]"
          git push

      - name: Publish to npm
        # `pnpm -r publish` skips any package whose version already exists on
        # the registry, so re-runs and unbumped packages are safe no-ops.
        if: steps.detect.outputs.has_changesets == 'true'
        run: pnpm -r publish --no-git-checks --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag + GitHub release on a major SDK bump (Rule #14)
        # When `template-goblin` crosses a major (e.g. 1.x → 2.0.0), make the
        # new major discoverable via an annotated git tag + a GitHub Release.
        # Runs AFTER the version commit is pushed and the publish succeeded, so
        # we never tag a local-only commit.
        if: steps.detect.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE="${{ steps.detect.outputs.core_before }}"
          AFTER="$(node -p "require('./packages/core/package.json').version")"
          if [ "${BEFORE%%.*}" != "${AFTER%%.*}" ]; then
            echo "Major bump: $BEFORE → $AFTER — tagging v$AFTER"
            git tag -a "v$AFTER" -m "v$AFTER"
            git push origin "v$AFTER"
            gh release create "v$AFTER" --generate-notes --title "v$AFTER"
          else
            echo "No major SDK bump ($BEFORE → $AFTER) — no tag/release needed."
          fi
